<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Оплата подписки через ЮKassa">
  <title>Оплата подписки</title>

  <link rel="preconnect" href="https://yookassa.ru">
  <link rel="stylesheet" href="https://yookassa.ru/integration/simplepay/css/yookassa_construct_form.css?v=1.34.0">
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f4f7fb;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background:
        radial-gradient(circle at top left, rgba(72, 102, 255, .16), transparent 35%),
        #f4f7fb;
    }

    .page { width: min(100%, 720px); }

    .intro {
      margin-bottom: 20px;
      text-align: center;
    }

    .intro h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 6vw, 42px);
      line-height: 1.1;
    }

    .intro p {
      margin: 0;
      color: #647086;
    }

    .payment-card {
      overflow: hidden;
      border: 1px solid rgba(21, 32, 51, .08);
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 24px 70px rgba(37, 50, 85, .13);
    }

    .payment-card-inner { padding: clamp(20px, 5vw, 40px); }

    .security-note {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      color: #516077;
      background: #f8faff;
      border-top: 1px solid #e9eef8;
      font-size: 14px;
    }

    .security-note svg { flex: 0 0 auto; color: #25a55f; }

    .yoomoney-payment-form { max-width: none; }
  </style>
</head>
<body>
  <main class="page">
    <header class="intro">
      <h1>Выберите подписку</h1>
      <p>Укажите количество и перейдите к безопасной оплате.</p>
    </header>

    <section class="payment-card" aria-label="Форма оплаты подписки">
      <div class="payment-card-inner">
        <form class="yoomoney-payment-form" action="https://yookassa.ru/integration/simplepay/payment" method="post" accept-charset="utf-8">
          <div class="ym-products">
            <div class="ym-block-title ym-products-title">Товары</div>

            <div class="ym-product">
              <div class="ym-product-line">
                <span class="ym-product-description">Подписка Pro на 1 месяц</span>
                <span class="ym-product-price" data-price="299" data-id="402" data-count="0">0,00&nbsp;₽</span>
              </div>
              <div class="ym-product-line ym-align-items-center">
                <span class="ym-label-text">Количество</span>
                <div class="ym-count-input">
                  <input class="ym-input" value="0.00" type="number" step="1" min="0" aria-label="Количество подписок Pro">
                  <span class="ym-count-control ym-count-plus" aria-hidden="true"></span>
                  <span class="ym-count-control ym-count-minus" aria-hidden="true"></span>
                </div>
              </div>
              <input disabled type="hidden" name="text" value="Подписка Pro на 1 месяц">
              <input disabled type="hidden" name="price" value="299">
              <input disabled type="hidden" name="quantity" value="0">
              <input disabled type="hidden" name="paymentSubjectType" value="commodity">
              <input disabled type="hidden" name="paymentMethodType" value="full_prepayment">
              <input disabled type="hidden" name="tax" value="1">
            </div>

            <div class="ym-product">
              <div class="ym-product-line">
                <span class="ym-product-description">Подписка Plus на 1 месяц</span>
                <span class="ym-product-price" data-price="149" data-id="677" data-count="0">0,00&nbsp;₽</span>
              </div>
              <div class="ym-product-line ym-align-items-center">
                <span class="ym-label-text">Количество</span>
                <div class="ym-count-input">
                  <input class="ym-input" value="0.00" type="number" step="1" min="0" aria-label="Количество подписок Plus">
                  <span class="ym-count-control ym-count-plus" aria-hidden="true"></span>
                  <span class="ym-count-control ym-count-minus" aria-hidden="true"></span>
                </div>
              </div>
              <input disabled type="hidden" name="text" value="Подписка Plus на 1 месяц">
              <input disabled type="hidden" name="price" value="149">
              <input disabled type="hidden" name="quantity" value="0">
              <input disabled type="hidden" name="paymentSubjectType" value="commodity">
              <input disabled type="hidden" name="paymentMethodType" value="full_prepayment">
              <input disabled type="hidden" name="tax" value="1">
            </div>

            <div class="ym-product">
              <div class="ym-product-line">
                <span class="ym-product-description">Подписка Basic на 1 месяц</span>
                <span class="ym-product-price" data-price="49" data-id="187" data-count="0">0,00&nbsp;₽</span>
              </div>
              <div class="ym-product-line ym-align-items-center">
                <span class="ym-label-text">Количество</span>
                <div class="ym-count-input">
                  <input class="ym-input" value="0.00" type="number" step="1" min="0" aria-label="Количество подписок Basic">
                  <span class="ym-count-control ym-count-plus" aria-hidden="true"></span>
                  <span class="ym-count-control ym-count-minus" aria-hidden="true"></span>
                </div>
              </div>
              <input disabled type="hidden" name="text" value="Подписка Basic на 1 месяц">
              <input disabled type="hidden" name="price" value="49">
              <input disabled type="hidden" name="quantity" value="0">
              <input disabled type="hidden" name="paymentSubjectType" value="commodity">
              <input disabled type="hidden" name="paymentMethodType" value="full_prepayment">
              <input disabled type="hidden" name="tax" value="1">
            </div>
          </div>

          <input value="" type="hidden" name="ym_merchant_receipt">

          <div class="ym-customer-info">
            <div class="ym-block-title">О покупателе</div>
            <input class="ym-input" name="email" placeholder="Телефон или Email для чека" type="text" autocomplete="email" required>
          </div>

          <input name="customerNumber" type="hidden" value="Оплата подписки">

          <div class="ym-payment-btn-block ym-before-line ym-align-space-between">
            <div class="ym-input-icon-rub ym-display-none">
              <input name="sum" placeholder="0.00" class="ym-input ym-sum-input ym-required-input" type="number" step="0.01" value="49">
            </div>
            <button data-text="Заплатить" class="ym-btn-pay ym-result-price" type="submit">
              <span class="ym-text-crop">Заплатить</span>
              <span class="ym-price-output">0,00&nbsp;₽</span>
            </button>
            <img src="https://yookassa.ru/integration/simplepay/img/iokassa-gray.svg?v=1.34.0" class="ym-logo" width="114" height="27" alt="ЮKassa">
          </div>

          <input name="shopId" type="hidden" value="1438599">
        </form>
      </div>

      <div class="security-note">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M7 10V7a5 5 0 0 1 10 0v3m-9 0h8a2 2 0 0 1 2 2v7H6v-7a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Платёж будет обработан на защищённой странице ЮKassa.
      </div>
    </section>
  </main>

  <script src="https://yookassa.ru/integration/simplepay/js/yookassa_construct_form.js?v=1.34.0"></script>
</body>
</html>
